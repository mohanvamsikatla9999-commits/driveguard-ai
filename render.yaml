services:
  - type: web
    name: driveguard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/driveguard.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: CORS_ORIGINS
        value: https://frontend-navy-ten-32.vercel.app
